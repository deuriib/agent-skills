# Pre-commit hooks: install with `pre-commit install`, run on all files with
# `pre-commit run --all-files`. Pin revs; bump deliberately, not automatically.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.0.3
    hooks:
      - id: editorconfig-checker
        alias: editorconfig

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, css, yaml, markdown]
        exclude: '^(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$'
