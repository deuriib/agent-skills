openapi: 3.0.3
info:
  title: EF2 API - Sistema de Facturación Electrónica
  description: |
    API REST para la emisión de **Comprobantes Fiscales Electrónicos (e-CF)** ante la
    **Dirección General de Impuestos Internos (DGII)** de la República Dominicana.

    ---

    ## Flujo de Integración

    ```
    ┌──────────────┐     ┌──────────────┐     ┌──────────────┐
    │  1. Login    │────▶│  2. Obtener  │────▶│  3. Enviar   │
    │  /auth/login │     │  Bearer Token│     │  Factura     │
    └──────────────┘     └──────────────┘     └──────────────┘
    ```

    1. **Autenticarse** con `POST /auth/login.php` para obtener un **Bearer Token JWT**
    2. **Incluir el token** en el header `Authorization: Bearer {token}` en cada petición
    3. **Enviar el e-CF** con `POST /procesar_factura.php` — el sistema genera el **eNCF automáticamente** desde la secuencia registrada (o puede enviarlo si el cliente administra su propia secuencia)

    ---

    ## Tipos de Comprobantes Electrónicos (TipoeCF)

    | Código | Prefijo | Nombre | Uso |
    |--------|---------|--------|-----|
    | **31** | E31 | Factura de Crédito Fiscal | Ventas a empresas con RNC (permite deducción de ITBIS) |
    | **32** | E32 | Factura de Consumidor Final | Ventas al por menor / consumidor final |
    | **33** | E33 | Nota de Débito | Cargos adicionales sobre factura previa |
    | **34** | E34 | Nota de Crédito | Anulaciones, devoluciones, descuentos |
    | **41** | E41 | Comprobante de Compra | Compras con retención de ITBIS e ISR |
    | **43** | E43 | Gastos Menores | Gastos menores sin RNC de comprador |
    | **44** | E44 | Regímenes Especiales | Ventas a zonas francas y regímenes especiales |
    | **45** | E45 | Gubernamental | Ventas a instituciones del gobierno |
    | **46** | E46 | Exportaciones | Ventas al exterior con logística |
    | **47** | E47 | Pagos al Exterior | Pagos a proveedores internacionales |

    ---

    ## Conceptos Importantes

    ### IndicadorMontoGravado
    - `"0"` → ITBIS **NO** incluido en los precios de los items (se suma aparte)
    - `"1"` → ITBIS **YA** incluido en los precios de los items

    ### Formato de Fechas
    Todas las fechas usan formato **`dd-mm-yyyy`** (ejemplo: `14-02-2026`)

    ### Formato de Montos
    Todos los montos deben enviarse como **string con 2 decimales** (ejemplo: `"1500.00"`)

    ### RNC (Registro Nacional de Contribuyente)
    - Personas jurídicas: **9 dígitos** (ejemplo: `131703836`)
    - Personas físicas (cédula): **11 dígitos** (ejemplo: `00114587496`)

    ### Códigos de Ubicación
    - **Provincia**: 6 dígitos (ejemplo: `010000` = Distrito Nacional)
    - **Municipio**: 6 dígitos (ejemplo: `010100` = Santo Domingo de Guzmán)

  version: 2.0.0
  contact:
    name: EF2 Soporte Técnico
    url: https://ef2.do
    email: soporte@ef2.do
  license:
    name: Uso Privado
    url: https://ef2.do/terminos

servers:
  - url: https://master.ef2.do/api2
    description: Servidor de Producción

tags:
  - name: Autenticación
    description: Endpoints para obtener y gestionar tokens de acceso
  - name: Facturación
    description: Emisión de comprobantes fiscales electrónicos (e-CF)
  - name: "E31 - Crédito Fiscal"
    description: Factura de Crédito Fiscal — ventas entre empresas
  - name: "E32 - Consumidor Final"
    description: Factura de Consumidor Final — ventas al por menor
  - name: "E33 - Nota de Débito"
    description: Nota de Débito — cargos adicionales
  - name: "E34 - Nota de Crédito"
    description: Nota de Crédito — anulaciones, devoluciones, descuentos
  - name: "E41 - Comprobante de Compra"
    description: Comprobante de Compra — con retenciones
  - name: "E43 - Gastos Menores"
    description: Gastos Menores — sin datos de comprador
  - name: "E44 - Regímenes Especiales"
    description: Regímenes Especiales — zonas francas
  - name: "E45 - Gubernamental"
    description: Comprobante Gubernamental — ventas al Estado
  - name: "E46 - Exportaciones"
    description: Exportaciones — ventas al exterior
  - name: "E47 - Pagos al Exterior"
    description: Pagos al Exterior — proveedores internacionales
  - name: "Secuencias e-NCF"
    description: |
      Gestión de rangos de secuencias de comprobantes fiscales electrónicos autorizados por la DGII.

      Cada empresa debe registrar los rangos de NCF (desde — hasta) que la DGII le ha autorizado,
      junto con su fecha de vencimiento. El sistema usa estos rangos para generar el **eNCF automáticamente**
      cuando se procesa una factura.

      **Reglas clave:**
      - Los rangos deben ser **consecutivos** — cada nuevo rango debe comenzar en `último_hasta + 1`
      - No se permiten **solapamientos** entre rangos del mismo tipo
      - El tipo **E32** no requiere fecha de vencimiento
      - Solo se pueden **eliminar** rangos inactivos (debe desactivarlos primero)

paths:
  /auth/login.php:
    post:
      tags:
        - Autenticación
      summary: Obtener token de acceso (JWT)
      description: |
        Autentica al usuario y retorna un **Bearer Token JWT** que debe usarse en todas las peticiones subsecuentes.

        ### Credenciales
        - **username**: Usuario API asignado (formato: `api_empresa_codigo`)
        - **password**: Token de API (formato: `tok_...`)

        > **Nota**: Si el password empieza con `tok_`, se puede usar directamente como Bearer Token sin necesidad de llamar a este endpoint.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Usuario API asignado a su empresa
                  example: api_2buy_mliec4sb
                password:
                  type: string
                  description: Token de autenticación (comienza con `tok_`)
                  example: tok_e0f3065a8a7df34785d30b744bf4715b3c3b96759a1a7ca19f354817e4471e2e
            examples:
              login_basico:
                summary: Login con credenciales API
                value:
                  username: api_2buy_mliec4sb
                  password: tok_e0f3065a8a7df34785d30b744bf4715b3c3b96759a1a7ca19f354817e4471e2e
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    description: Bearer Token JWT para autenticación
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  message:
                    type: string
                    example: Login exitoso
                  empresa:
                    type: object
                    description: Datos de la empresa autenticada
                    properties:
                      nombre:
                        type: string
                        example: 2BUY ELECTRONICS AND SERVICES SRL
                      rnc:
                        type: string
                        example: "132596161"
              example:
                success: true
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                message: Login exitoso
                empresa:
                  nombre: 2BUY ELECTRONICS AND SERVICES SRL
                  rnc: "132596161"
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Usuario o contraseña incorrectos

  /procesar_factura.php:
    post:
      tags:
        - Facturación
      summary: Procesar comprobante fiscal electrónico (e-CF)
      description: |
        Endpoint principal para emitir cualquier tipo de comprobante fiscal electrónico.

        El sistema **genera automáticamente el eNCF** (número de comprobante) — no es necesario enviarlo.

        La estructura del JSON varía según el **TipoeCF** (ver ejemplos individuales por tipo).
      operationId: procesarFactura
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ECFRequest'
            examples:
              e31_credito_fiscal:
                $ref: '#/components/examples/E31_CreditoFiscal'
              e32_consumidor_final_menor_250k:
                $ref: '#/components/examples/E32_ConsumidorFinal_Menor250K'
              e32_consumidor_final_mayor_250k:
                $ref: '#/components/examples/E32_ConsumidorFinal_Mayor250K'
              e33_nota_debito:
                $ref: '#/components/examples/E33_NotaDebito'
              e34_nota_credito:
                $ref: '#/components/examples/E34_NotaCredito'
              e41_comprobante_compra:
                $ref: '#/components/examples/E41_ComprobanteCompra'
              e43_gastos_menores:
                $ref: '#/components/examples/E43_GastosMenores'
              e44_regimenes_especiales:
                $ref: '#/components/examples/E44_RegimenesEspeciales'
              e45_gubernamental:
                $ref: '#/components/examples/E45_Gubernamental'
              e46_exportaciones:
                $ref: '#/components/examples/E46_Exportaciones'
              e47_pagos_exterior:
                $ref: '#/components/examples/E47_PagosExterior'
      responses:
        '200':
          description: Comprobante procesado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaResponse'
              example:
                success: true
                Estado: Procesada
                eNCF: E310000012345
                UrlENCF: https://master.ef2.do/consulta/E310000012345
                FechaEmision: "14-02-2026"
                MontoTotal: "1180.00"
                message: Factura procesada exitosamente
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Error de validación"
                errors:
                  - "El RNCComprador debe tener 9 u 11 dígitos"
                  - "El campo MontoTotal es requerido"
        '401':
          description: Token no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Token de autenticación requerido"
        '403':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Token inválido o expirado"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Error interno del servidor al procesar la factura"

  /ecf_secuencia_api.php:
    get:
      tags:
        - "Secuencias e-NCF"
      summary: Listar / consultar secuencias e-NCF
      description: |
        Endpoint multipropósito para consultar secuencias. El comportamiento depende de los
        parámetros query enviados (se evalúan en este orden de prioridad):

        | Parámetro | Descripción |
        |-----------|-------------|
        | `id={rango_id}` | Retorna un rango específico con estadísticas |
        | `prefijo=E31` | Retorna el `max(hasta)` + rango activo para un prefijo |
        | `disponibilidad_prefijo=E31` | Retorna disponibilidad total (secuencias libres) para un prefijo |
        | `resource=tipos_ecf` | Lista los tipos de e-CF disponibles en el sistema |
        | `resource=tipos_ecf&filter=empresa` | Lista solo tipos configurados para la empresa |
        | *(sin parámetros)* | Lista **todos** los rangos de la empresa con estadísticas |

        Todos los resultados están limitados a la empresa asociada al Bearer Token.
      operationId: listarSecuencias
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: ID del rango específico a consultar
          example: 42
        - name: prefijo
          in: query
          required: false
          schema:
            type: string
          description: Prefijo (E31, E32, ...) para obtener último número y rango activo
          example: E31
        - name: disponibilidad_prefijo
          in: query
          required: false
          schema:
            type: string
          description: Prefijo para obtener secuencias disponibles totales
          example: E31
        - name: resource
          in: query
          required: false
          schema:
            type: string
            enum: [sequences, tipos_ecf]
          description: Recurso a consultar. Por defecto `sequences`
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [empresa]
          description: Solo aplica con `resource=tipos_ecf`. Usar `empresa` para filtrar tipos ya configurados
      responses:
        '200':
          description: Consulta exitosa
          content:
            application/json:
              examples:
                listar_secuencias:
                  summary: Listar todos los rangos de la empresa
                  value:
                    success: true
                    message: "Secuencias obtenidas exitosamente"
                    data:
                      - id: 42
                        tipo_ecf_id: 1
                        prefijo: "E31"
                        desde: 1
                        hasta: 50000
                        secuencia_actual: 3935
                        fecha_vencimiento: "2028-12-31"
                        estado: true
                        tipo_codigo: "31"
                        tipo_nombre: "Factura de Crédito Fiscal"
                        total_secuencias: 50000
                        secuencias_usadas: 3935
                        secuencias_disponibles: 46065
                        porcentaje_uso: 7.87
                        created_at: "2025-01-15 10:30:00"
                        updated_at: "2026-02-14 15:22:41"
                rango_por_id:
                  summary: Rango específico (?id=42)
                  value:
                    success: true
                    message: "Rango obtenido exitosamente"
                    data:
                      id: 42
                      tipo_ecf_id: 1
                      prefijo: "E31"
                      desde: 1
                      hasta: 50000
                      secuencia_actual: 3935
                      secuencias_disponibles: 46065
                      porcentaje_uso: 7.87
                      estado: true
                max_hasta_prefijo:
                  summary: Máximo `hasta` para un prefijo (?prefijo=E31)
                  value:
                    success: true
                    message: "Valor máximo obtenido exitosamente"
                    data:
                      prefijo: "E31"
                      max_hasta: 50000
                      tipo_codigo: "31"
                      tipo_nombre: "Factura de Crédito Fiscal"
                      total_rangos: 1
                      rango_activo:
                        desde: 1
                        hasta: 50000
                        secuencia_actual: 3935
                        estado: true
                      existe: true
                disponibilidad_prefijo:
                  summary: Disponibilidad total por prefijo
                  value:
                    success: true
                    message: "Disponibilidad obtenida exitosamente"
                    data:
                      prefijo: "E31"
                      tipo_codigo: "31"
                      tipo_nombre: "Factura de Crédito Fiscal"
                      disponibilidad_total: 46065
                      rangos_activos: 1
                      tiene_vencimiento: true
                      fecha_vencimiento_proxima: "2028-12-31"
                tipos_ecf:
                  summary: Catálogo de tipos (?resource=tipos_ecf)
                  value:
                    success: true
                    message: "Tipos ECF obtenidos exitosamente"
                    data:
                      - id: 1
                        codigo: "31"
                        nombre: "Factura de Crédito Fiscal"
                        prefijo: "E31"
                        estado: true
                      - id: 2
                        codigo: "32"
                        nombre: "Factura de Consumo Electrónica"
                        prefijo: "E32"
                        estado: true
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - "Secuencias e-NCF"
      summary: Crear nuevo rango de secuencias
      description: |
        Registra un nuevo rango de secuencias autorizado por la DGII.

        **Validaciones:**
        - El `desde` debe ser igual a `MAX(hasta) + 1` del último rango del mismo tipo (continuidad)
        - No puede solaparse con rangos existentes
        - La `secuencia_actual` debe estar entre `desde` y `hasta` (o ser 0 para comenzar desde el inicio)
        - La `fecha_vencimiento` es obligatoria salvo para **E32** (se asigna +100 años automáticamente)
      operationId: crearSecuencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecuenciaCreateRequest'
            examples:
              e31_primer_rango:
                summary: Primer rango E31
                value:
                  tipo_ecf_id: 1
                  prefijo: "E31"
                  desde: 1
                  hasta: 50000
                  secuencia_actual: 0
                  fecha_vencimiento: "2028-12-31"
                  estado: true
              e32_sin_vencimiento:
                summary: Rango E32 (sin fecha de vencimiento)
                value:
                  tipo_ecf_id: 2
                  prefijo: "E32"
                  desde: 1
                  hasta: 100000
                  secuencia_actual: 0
                  estado: true
              e31_continuacion:
                summary: Rango consecutivo (continuación)
                value:
                  tipo_ecf_id: 1
                  prefijo: "E31"
                  desde: 50001
                  hasta: 100000
                  secuencia_actual: 0
                  fecha_vencimiento: "2029-12-31"
                  estado: true
      responses:
        '200':
          description: Rango creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuenciaResponse'
              example:
                success: true
                message: "Rango de secuencias creado exitosamente"
                data:
                  id: 43
                  tipo_ecf_id: 1
                  prefijo: "E31"
                  desde: 50001
                  hasta: 100000
                  secuencia_actual: 0
                  fecha_vencimiento: "2029-12-31"
                  estado: 1
                  tipo_codigo: "31"
                  tipo_nombre: "Factura de Crédito Fiscal"
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                solapamiento:
                  value:
                    success: false
                    message: "El rango se solapa con otro existente"
                sin_continuidad:
                  value:
                    success: false
                    message: "El número inicial debe ser 50001 para continuar la secuencia del último rango registrado"
                rango_activo_existente:
                  value:
                    success: false
                    message: "Ya existe un rango activo para este tipo de comprobante"
    put:
      tags:
        - "Secuencias e-NCF"
      summary: Actualizar rango existente
      description: |
        Actualiza campos de un rango existente. Todos los campos (salvo `id`) son opcionales —
        solo se actualizan los que se envíen.

        Para **activar** un rango inactivo no debe existir otro rango activo del mismo tipo.
      operationId: actualizarSecuencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecuenciaUpdateRequest'
            examples:
              actualizar_contador:
                summary: Actualizar secuencia actual
                value:
                  id: 42
                  secuencia_actual: 4500
              desactivar:
                summary: Desactivar rango
                value:
                  id: 42
                  estado: false
              extender_rango:
                summary: Extender número final
                value:
                  id: 42
                  hasta: 75000
      responses:
        '200':
          description: Rango actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuenciaResponse'
              example:
                success: true
                message: "Rango actualizado exitosamente"
                data:
                  id: 42
                  secuencia_actual: 4500
                  estado: 1
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Rango no encontrado o no pertenece a su empresa"
    delete:
      tags:
        - "Secuencias e-NCF"
      summary: Eliminar rango inactivo
      description: |
        Elimina un rango de secuencias. **Solo se permite eliminar rangos inactivos** —
        primero debe desactivar el rango con un PUT (`estado: false`).
      operationId: eliminarSecuencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: ID del rango a eliminar
                  example: 42
      responses:
        '200':
          description: Rango eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Rango eliminado exitosamente"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
        '400':
          description: No se puede eliminar un rango activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "No se puede eliminar un rango activo. Desactívelo primero"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT obtenido del endpoint `/auth/login.php`.

        Incluir en cada petición:
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIs...
        ```

  examples:
    # =====================================================
    # E31 - FACTURA DE CRÉDITO FISCAL
    # =====================================================
    E31_CreditoFiscal:
      summary: "E31 - Factura de Crédito Fiscal"
      description: |
        Factura para ventas entre empresas. Requiere RNC válido del comprador.
        Permite al comprador deducir el ITBIS pagado.
      value:
        ECF:
          Encabezado:
            Version: "1.0"
            IdDoc:
              TipoeCF: "31"
              FechaVencimientoSecuencia: "31-12-2028"
              IndicadorMontoGravado: "0"
              TipoIngresos: "01"
              TipoPago: "1"
            Emisor:
              RNCEmisor: "132596161"
              RazonSocialEmisor: "2BUY ELECTRONICS AND SERVICES SRL"
              NombreComercial: "2BUY ELECTRONICS"
              DireccionEmisor: "Av. San Vicente de Paul, Esq. Puerto Rico, Baro Plaza"
              Municipio: "010100"
              Provincia: "010000"
              CorreoEmisor: "info@2buy.do"
              FechaEmision: "14-02-2026"
            Comprador:
              RNCComprador: "131703836"
              RazonSocialComprador: "GRUPO MEDIA SOFT TECHNOLOGY GMS SRL"
              CorreoComprador: "compras@mediasoft.do"
              DireccionComprador: "Santo Domingo"
              MunicipioComprador: "010100"
              ProvinciaComprador: "010000"
            Totales:
              MontoGravadoTotal: "1500.00"
              MontoGravadoI1: "1500.00"
              ITBIS1: "18"
              TotalITBIS: "270.00"
              TotalITBIS1: "270.00"
              MontoTotal: "1770.00"
          DetallesItems:
            Item:
              - NumeroLinea: "1"
                IndicadorFacturacion: "1"
                NombreItem: "Licencia de software plan emprendedor"
                IndicadorBienoServicio: "2"
                CantidadItem: "1"
                UnidadMedida: "43"
                PrecioUnitarioItem: "1500.00"
                MontoItem: "1500.00"

    # =====================================================
    # E32 - FACTURA DE CONSUMIDOR FINAL (< RD$250,000)
    # =====================================================
    E32_ConsumidorFinal_Menor250K:
